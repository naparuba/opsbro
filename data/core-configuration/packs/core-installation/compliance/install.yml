compliance:
   name    : Install OpsBro system dependencies
   mode    : enforcing
   interval: 1s
   note    : This will install system prereqs about opsbro
   rule    :
      type        : package-install
      # You can set variables in order to not repeat yourself in the if rules
      variables   :
         is_debian            : "{{collector.system.os.linux.distribution}} == 'debian' or {{collector.system.os.linux.distribution}} == 'raspbian'"
         is_rocky             : "{{collector.system.os.linux.distribution}} == 'rocky-linux'"
         is_alma              : "{{collector.system.os.linux.distribution}} == 'almalinux'"
         is_fedora            : "{{collector.system.os.linux.distribution}} == 'fedora'"
         is_alpine_12_and_more: "{{collector.system.os.linux.distribution}} == 'alpine' and {{collector.system.os.linux.minor_version}} >= 12"   # TODO: in order to avoid the 2*and limitation in variables
         is_ubuntu            : "{{collector.system.os.linux.distribution}} == 'ubuntu'"
         is_amazon_linux2     : "{{collector.system.os.linux.distribution}} == 'amazon-linux2'"
         is_amazon_linux2022  : "{{collector.system.os.linux.distribution}} == 'amazon-linux2022'"
         is_redhat            : "{{collector.system.os.linux.distribution}} == 'redhat'"
         is_oracle_linux      : "{{collector.system.os.linux.distribution}} == 'oracle-linux'"
         is_opensuse          : "{{collector.system.os.linux.distribution}} == 'opensuse'"
      environments:
         # NOTE: figlet -f slant "XXX"
         ### Centos
         #     ______           __
         #   / ____/__  ____  / /_____  _____
         #  / /   / _ \/ __ \/ __/ __ \/ ___/
         # / /___/  __/ / / / /_/ /_/ (__  )
         # \____/\___/_/ /_/\__/\____/____/

         
         # The new centos 8
         -  name         : rockylinux
            if           : "{{variables.is_rocky}}"
            parameters   :
               packages:
                  - libgomp   # monotonic clock
                  - epel-release
                  - python3-rpm
                  - python3-jinja2
                  # python3-pycryptodomex  # not the good one too
                  # python3-cryptography  # not working on centos8
                  - leveldb     # no python-leveldb for centos8
                  - python3-simplejson
                  - python3-setproctitle
                  - python3-psutil
                  - python3-yaml
                  - bash-completion  # Bash completion to enable the CLI completion
                  # For pycrypto
                  - gcc
                  - python3-devel
            post_commands:
               - pip3 install pycrypto
         
         
         # The new centos 8 bis
         -  name         : almalinux
            if           : "{{variables.is_alma}}"
            parameters   :
               packages:
                  - libgomp   # monotonic clock
                  - epel-release
                  - python3-rpm
                  - python3-jinja2
                  # python3-pycryptodomex  # not the good one too
                  # python3-cryptography  # not working on centos8
                  - leveldb     # no python-leveldb for centos8
                  - python3-simplejson
                  - python3-setproctitle
                  - python3-psutil
                  - python3-yaml
                  - bash-completion  # Bash completion to enable the CLI completion
                  # For pycrypto
                  - gcc
                  - python3-devel
            post_commands:
               - pip3 install pycrypto
         
         # We can have redhat8 in docker, but not 7... ok redhat...
         -  name         : redhat8_and_9
            if           : "{{variables.is_redhat}} and {{collector.system.os.linux.major_version}} >= 8"
            parameters   :
               packages:
                  #- libgomp   # monotonic clock
                  #- epel-release
                  - python3-rpm
                  - python3-jinja2
                  # python3-cryptography  # not working on centos8
                  #- leveldb     # no python-leveldb for centos8
                  #- python3-simplejson
                  #- python3-setproctitle
                  #- python3-psutil
                  - python3-yaml
                  - bash-completion  # Bash completion to enable the CLI completion
                  # For pycrypto
                  - gcc
                  - gcc-c++
                  - python3-devel
                  - python3-cryptography
            post_commands:
               #- pip3 install pycrypto
               - pip3 install simplejson setproctitle leveldb psutil pycrypto


         -  name      : is_oracle_linux_7
            if        : "{{variables.is_oracle_linux}} and {{collector.system.os.linux.major_version}} == 7"
            parameters:
               packages:
                  - oracle-epel-release-el7  # for yaml
                  - python3-rpm
                  - python36-jinja2
                  - python3-setuptools
                  - python36-PyYAML
                  #- gcc
                  #- gcc-c++
                  #- python3-devel
                  - python36-leveldb  # in epel
                  - python36-simplejson  # in epel
                  - python36-setproctitle # in epel
                  - python36-psutil  # in epel
                  - python36-crypto  # in epel
                  - bash-completion  # Bash completion to enable the CLI completion
                  # python3-cryptography is not the valid one
         
         
         
         -  name         : oracle_linux_8
            if           : "{{variables.is_oracle_linux}} and {{collector.system.os.linux.major_version}} == 8"
            parameters   :
               packages:
                  - oracle-epel-release-el8  # for yaml
                  - python3-rpm
                  - python3-jinja2
                  - python3-setuptools
                  - python3-pyyaml  # in epel
                  - leveldb  # in epel
                  - python3-simplejson  # in epel
                  - python3-setproctitle # in epel
                  - python3-psutil  # in epel
                  # - python3-pycryptodomex/python3-cryptography  no valid one founded in repos
                  - gcc                # for pycrypto
                  - python3-devel      # for pycrypto
                  - bash-completion  # Bash completion to enable the CLI completion
            post_commands:
               - pip3 install pycrypto


         -  name         : oracle_linux__9
            if           : "{{variables.is_oracle_linux}} and {{collector.system.os.linux.major_version}} == 9"
            parameters   :
               packages:
                  - oracle-epel-release-el9  # for yaml
                  - python3-rpm
                  - python3-jinja2
                  - python3-setuptools
                  - python3-pyyaml  # in epel
                  - leveldb  # in epel
                  - python3-simplejson  # in epel
                  - python3-setproctitle # in epel
                  - python3-psutil  # in epel
                  - python3-pycryptodomex
                  - bash-completion  # Bash completion to enable the CLI completion

         
         ### DEBIAN
         #      ____       __    _
         #    / __ \___  / /_  (_)___ _____
         #   / / / / _ \/ __ \/ / __ `/ __ \
         #  / /_/ /  __/ /_/ / / /_/ / / / /
         # /_____/\___/_.___/_/\__,_/_/ /_/

         
         
         -  name      : debian_python3_10_and_less
            if        : "({{variables.is_debian}} and system_is_python_3()) and {{collector.system.os.linux.major_version}} <= 10 "
            parameters:
               packages:
                  - python3-jinja2
                  - python3-crypto
                  - python3-setuptools
                  - python3-leveldb
                  - python3-simplejson
                  - python3-setproctitle
                  - python3-psutil
                  - python3-yaml
                  - gnupg            # for  apt-key adv  (repository)
                  - bash-completion  # Bash completion to enable the CLI completion
         
         
         # Debian 11: need python3-pycryptodome for crypto
         -  name      : debian_python3_11_and_more
            if        : "({{variables.is_debian}} and system_is_python_3()) and {{collector.system.os.linux.major_version}} >= 11"
            parameters:
               packages:
                  - python3-jinja2
                  - python3-pycryptodome
                  - python3-setuptools
                  - libleveldb1d  # no native python wrapper
                  - python3-simplejson
                  - python3-setproctitle
                  - python3-psutil
                  - python3-yaml
                  - python3-requests
                  - gnupg            # for  apt-key adv  (repository)
                  - bash-completion  # Bash completion to enable the CLI completion

         ### Ubuntu
         #    __  ____                __
         #   / / / / /_  __  ______  / /___  __
         #  / / / / __ \/ / / / __ \/ __/ / / /
         # / /_/ / /_/ / /_/ / / / / /_/ /_/ /
         # \____/_.___/\__,_/_/ /_/\__/\__,_/

         
         
         # ubuntu 18.10 do not have libleveldb1d but libleveldb1d
         -  name      : ubuntu_18_04_python3
            if        : "({{variables.is_ubuntu}} and system_is_python_3()) and {{collector.system.os.linux.version}} == '18.04' "
            parameters:
               packages:
                  - python3-jinja2
                  - python3-crypto
                  - python3-setuptools
                  - python3-simplejson
                  - python3-setproctitle
                  - python3-psutil
                  - python3-yaml
                  - libleveldb1v5   # no python3-leveldb, only python3-plyvel
                  - bash-completion  # Bash completion to enable the CLI completion
                  - gnupg          # for repositories
                  - ca-certificates  # for repositories
         
         
         # This ubuntu version have a special crypto package
         -  name      : ubuntu_22_04_and_24_04
            if        : "({{variables.is_ubuntu}} and system_is_python_3()) and ({{collector.system.os.linux.version}} in ('22.04', '24.04') ) "
            parameters:
               packages:
                  - python3-jinja2
                  - python3-pycryptodome  # this version exception
                  - python3-setuptools
                  - python3-simplejson
                  - python3-setproctitle
                  - python3-psutil
                  - python3-yaml
                  - libleveldb1d   # no python3-leveldb, only python3-plyvel
                  - bash-completion  # Bash completion to enable the CLI completion
                  - gnupg          # for repositories
                  - ca-certificates  # for repositories
         
                  
         -  name      : ubuntu_python3
            if        : "{{variables.is_ubuntu}} and system_is_python_3()"
            parameters:
               packages:
                  - python3-jinja2
                  - python3-crypto
                  - python3-setuptools
                  - python3-simplejson
                  - python3-setproctitle
                  - python3-psutil
                  - python3-yaml
                  - libleveldb1d   # no python3-leveldb, only python3-plyvel
                  - bash-completion  # Bash completion to enable the CLI completion
                  - gnupg          # for repositories
                  - ca-certificates  # for repositories
         
         
         ##### FEDORA:
         #      ______         __
         #    / ____/__  ____/ /___  _________ _
         #   / /_  / _ \/ __  / __ \/ ___/ __ `/
         #  / __/ /  __/ /_/ / /_/ / /  / /_/ /
         # /_/    \___/\__,_/\____/_/   \__,_/
         # there are rules for 24, 25, 26 -> 30 (python2) and 31+ (python3)
         # and So fedora 31 and more

         
         # there are rules for 24, 25, 26 -> 30 (python2) and 31+ (python3)
         # and So fedora 31 and more
         -  name      : fedora_python3
            if        : "{{variables.is_fedora}} and system_is_python_3()"
            parameters:
               packages:
                  - python3-rpm
                  - python3-jinja2
                  - python3-crypto
                  - python3-simplejson
                  - bash-completion  # Bash completion to enable the CLI completion
                  - leveldb
                  - python3-setproctitle
                  - python3-psutil
                  - python3-yaml
         
         ### Alpine
         #     ___    __      _
         #    /   |  / /___  (_)___  ___
         #   / /| | / / __ \/ / __ \/ _ \
         #  / ___ |/ / /_/ / / / / /  __/
         # /_/  |_/_/ .___/_/_/ /_/\___/
         #         /_/
         
         # Alpine 3.12+ => for python 3
         -  name      : alpine12_py3_and_more
            if        : "{{variables.is_alpine_12_and_more}}"
            parameters:
               packages:
                  - musl-dev  # monotonic clock
                  - py3-jinja2
                  - py3-pycryptodome
                  #- py3-crypto  # alias to pycryptodome
                  - py3-setuptools
                  - leveldb
                  - py3-simplejson
                  - py3-setproctitle
                  - py3-psutil
                  - py3-yaml
                  # Bash completion to enable the CLI completion
                  - bash-completion

         
         ### Opensuse
         #    ____
         #   / __ \____  ___  ____  _______  __________
         #  / / / / __ \/ _ \/ __ \/ ___/ / / / ___/ _ \
         # / /_/ / /_/ /  __/ / / (__  ) /_/ (__  )  __/
         # \____/ .___/\___/_/ /_/____/\__,_/____/\___/
         #     /_/
         # Open suse 15.+
         -  name      : opensuse_15_plus
            if        : "({{variables.is_opensuse}} and {{collector.system.os.linux.major_version}} == 15) and ({{collector.system.os.linux.minor_version}} >= 4)"
            parameters:
               packages:
                  - python3-rpm
                  - python3-Jinja2
                  - python3-pycryptodome
                  - python3-simplejson
                  - python3-setuptools
                  - python3-leveldb
                  - bash-completion  # Bash completion to enable the CLI completion
                  - python3-psutil
                  - python3-setproctitle
                  - python3-pyaml

         
         ### Amazon
         #      ___
         #    /   |  ____ ___  ____ _____  ____  ____
         #   / /| | / __ `__ \/ __ `/_  / / __ \/ __ \
         #  / ___ |/ / / / / / /_/ / / /_/ /_/ / / / /
         # /_/  |_/_/ /_/ /_/\__,_/ /___/\____/_/ /_/
         
         # 2023 version of amazonlinux2
         - name: amazon_linux2023
           if: "{{variables.is_amazon_linux2}} and {{collector.system.os.linux.major_version}}  ==2023"
           parameters:
              packages:
                 - python3-rpm
                 - python3-jinja2
                 - python3-crypto
                 - bash-completion  # Bash completion to enable the CLI completion
                 - python3-setproctitle
                 - python3-psutil
                 - python3-pyyaml
                 # For leveldb: need to go with pip
                 - python3-pip
                 - gcc
                 - gcc-c++
                 - python3-setuptools
                 - python3-devel
           post_commands:
              - pip install simplejson leveldb

         # amazonlinux2
         - name: amazon_linux2
           if: "{{variables.is_amazon_linux2}} and {{collector.system.os.linux.major_version}}  == 2"
           parameters:
              packages:
                 - python3-rpm
                 - python3-jinja2
                 #- python3-crypto   # no such package
                 - bash-completion  # Bash completion to enable the CLI completion
                 #- python3-setproctitle
                 - python3-psutil
                 - python3-PyYAML
                 - python3-simplejson
                 # For leveldb: need to go with pip
                 - python3-pip
                 - gcc
                 - gcc-c++
                 - python3-setuptools
                 - python3-devel
           post_commands:
              - pip3 install leveldb setproctitle pycrypto
               
         # new amazonlinux2, 2022 edition, with python3 + fedora based
         -  name         : amazon_linux2022
            if           : "{{variables.is_amazon_linux2022}}"
            parameters   :
               packages:
                  - python3-rpm
                  - python3-jinja2
                  - python3-crypto
                  - bash-completion  # Bash completion to enable the CLI completion
                  - python3-setproctitle
                  - python3-psutil
                  - python3-pyyaml
                  # For leveldb: need to go with pip
                  - python3-pip
                  - gcc
                  - gcc-c++
                  - python3-setuptools
                  - python3-devel
            post_commands:
               - pip install simplejson leveldb

